name: Daily Blog Post

on:
  schedule:
    - cron: "0 14 * * *"    # 23:00 JST
  workflow_dispatch:        # GitHub UI から手動実行も可能
    inputs:
      test_mode:
        description: "TEST_MODE: Telegram/Gemini をスキップして固定文字列で投稿"
        required: false
        default: "false"
        type: boolean
      debug_mode:
        description: "DEBUG_MODE: HTTP リクエスト/レスポンスの詳細を出力"
        required: false
        default: "false"
        type: boolean

# collect.yml と同じ Gist を読み書きするため、同じグループで直列化して PATCH の競合を防ぐ
# 本ワークフローは最長3時間動くため、その間 collect.yml の定期実行は待たされるが、
# post.py 自身が各試行で collect_once() を呼んで収集するため取りこぼしは発生しない
concurrency:
  group: collect-telegram-memos
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Python をセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: ブログ投稿スクリプトを実行
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          JUGEM_USER:       ${{ secrets.JUGEM_USER }}
          JUGEM_PASS:       ${{ secrets.JUGEM_PASS }}
          TEST_MODE:        ${{ inputs.test_mode || 'false' }}
          DEBUG_MODE:       ${{ inputs.debug_mode || 'false' }}
          PYTHONUNBUFFERED: "1"
          WEATHER_LOCATION: ${{ vars.WEATHER_LOCATION }}
          GITHUB_USERNAME:  ${{ github.repository_owner }}
          # GH_PAT（個人アクセストークン）を登録すればそちらを優先。
          # GITHUB_TOKEN はユーザー系 API で 403 になるため、その場合は認証なしで再試行される
          GH_API_TOKEN:     ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GCAL_CLIENT_ID:   ${{ secrets.GCAL_CLIENT_ID }}
          GCAL_CLIENT_SECRET: ${{ secrets.GCAL_CLIENT_SECRET }}
          GCAL_REFRESH_TOKEN: ${{ secrets.GCAL_REFRESH_TOKEN }}
          TMDB_API_KEY:         ${{ secrets.TMDB_API_KEY }}
          GIST_ID:              ${{ secrets.GIST_ID }}
          GIST_TOKEN:           ${{ secrets.GIST_TOKEN }}
          GHEALTH_REFRESH_TOKEN: ${{ secrets.GHEALTH_REFRESH_TOKEN }}
        run: python post.py
