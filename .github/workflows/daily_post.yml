name: Daily Blog Post

on:
  schedule:
    - cron: "0 13 * * *"    # 22:00 JST
    - cron: "30 13 * * *"   # 22:30 JST
    - cron: "0 14 * * *"    # 23:00 JST
    - cron: "30 14 * * *"   # 23:30 JST
    - cron: "0 15 * * *"    # 00:00 JST
    - cron: "30 15 * * *"   # 00:30 JST
    - cron: "0 16 * * *"    # 01:00 JST
    - cron: "30 16 * * *"   # 01:30 JST
    - cron: "0 17 * * *"    # 02:00 JST
    - cron: "30 17 * * *"   # 02:30 JST
    - cron: "0 18 * * *"    # 03:00 JST
    - cron: "30 18 * * *"   # 03:30 JST
    - cron: "0 19 * * *"    # 04:00 JST（最終試行）
  workflow_dispatch:        # GitHub UI から手動実行も可能
    inputs:
      test_mode:
        description: "TEST_MODE: Telegram/Gemini をスキップして固定文字列で投稿"
        required: false
        default: "false"
        type: boolean
      debug_mode:
        description: "DEBUG_MODE: HTTP リクエスト/レスポンスの詳細を出力"
        required: false
        default: "false"
        type: boolean

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ブログ投稿スクリプトを実行
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          JUGEM_USER:       ${{ secrets.JUGEM_USER }}
          JUGEM_PASS:       ${{ secrets.JUGEM_PASS }}
          TEST_MODE:        ${{ inputs.test_mode || 'false' }}
          DEBUG_MODE:       ${{ inputs.debug_mode || 'false' }}
          WEATHER_LOCATION: ${{ vars.WEATHER_LOCATION }}
          GITHUB_USERNAME:  ${{ github.repository_owner }}
          GH_API_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          GCAL_CLIENT_ID:   ${{ secrets.GCAL_CLIENT_ID }}
          GCAL_CLIENT_SECRET: ${{ secrets.GCAL_CLIENT_SECRET }}
          GCAL_REFRESH_TOKEN: ${{ secrets.GCAL_REFRESH_TOKEN }}
          TMDB_API_KEY:       ${{ secrets.TMDB_API_KEY }}
        run: python post.py
