name: Collect Telegram Memos

on:
  schedule:
    - cron: "0 */2 * * *"    # 2時間ごと（Telegram の24時間保持制限に対する余裕を確保）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN: Gist に書き込まず取得内容だけ表示"
        required: false
        default: false
        type: boolean

# 前の実行が終わる前に次が始まると offset が競合するため直列化する
concurrency:
  group: collect-telegram-memos
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Python をセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: メモ収集スクリプトを実行
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_ID:          ${{ secrets.GIST_ID }}
          GIST_TOKEN:       ${{ secrets.GIST_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python collect.py ${{ inputs.dry_run && '--dry-run' || '' }}
